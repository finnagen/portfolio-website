<!DOCTYPE HTML>
<html lang="en">
    <link rel="stylesheet" href="style.css">
    <head>
        <meta charset="UTF-8">
        <title>gort.</title>
        <link rel="icon" href="https://i.ibb.co/GSXyLhp/gortpfp.png" type="image/png">
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    </head>

    <body>
        <div class="top_nav">
            <a href="../index.html">Home</a>
            <a href="../about/index.html">About Me</a>
            <a class="current" href="./index.html">Past Works</a>

            <img src="https://i.ibb.co/Pv3HvXH9/gort-logo.png" alt="gort." class="gort_logo_image">
        </div>

        <div class="title_container">
            <h1 class="main_header">
                past work
            </h1>

            <p>
                <i>everyone's favorite part!</i>
            </p>

            <hr>
        </div>

        <div class="card_backdrop" id="backdrop"></div>
        <div class="card_display" id="display">
            <h1 class="title">
                project title
            </h1>
            <a href="https://example.com" target="_blank">
                <img src="https://media1.tenor.com/m/lUYaPsjd9ZcAAAAC/ring-camera-dog.gif">
            </a>
            <p class="description">
                small description
            </p>
        </div>

        <div class="grid_container">

        </div>

        <script>
            function show(element, animation_class) {
                element.css("visibility", "visible")

                if (animation_class) {
                    element.addClass(animation_class)
                }
            }

            function hide(element, animation_class) {
                element.css("visibility", "hidden");
                if (animation_class) {
                    element.removeClass(animation_class);
                }
            }

            var project_data

            function create_projects() {
                Object.entries(project_data).forEach(([category, projects]) => {
                const header = document.createElement("h2")
                header.className = "main_header"
                header.textContent = category

                const display = document.createElement("div")
                display.className = "display"

                Object.entries(projects).forEach(([id, project]) => {
                    const card = document.createElement("div")
                    card.className = "project"

                    card.id = id
                    card.dataset.category = category

                    const img = document.createElement("img")
                    img.src = "https://i.ibb.co/Pv3HvXH9/gort-logo.png"
                    img.alt = project.title

                    const title = document.createElement("h3")
                    title.textContent = project.title

                    card.append(img, title)
                    display.appendChild(card)
                })

                container.append(header, display)
            })
            }

            $.getJSON("./project_data.json", function(data) {
                project_data = data
                create_projects()
            });
            

            const container = document.querySelector(".grid_container");

            $(document).ready(function() {
                $(document).on("click", ".project", function() {
                    var $project = $(this)
                    var category = $project.data("category")
                    var projectId = $project.attr("id")

                    if (!project_data || !project_data[category] || !project_data[category][projectId]) {
                        return
                    }

                    var data = project_data[category][projectId]

                    $("#display .title").text(data.title)
                    $("#display .description").text(data.description)
                    $("#display a img").attr("src", data.media)

                    if (data.ref) {
                        $("#display a").attr("href", data.ref)
                    }
                    else {
                        $("#display a").removeAttr("href")
                    }

                    show($("#backdrop"), "div_show")
                    show($("#display"), "div_pop_up")
                });

                $("#backdrop").on("click", function() {
                    hide($("#backdrop"), "div_show");
                    hide($("#display"), "div_pop_up");
                });

                $("#display").on("click", function(event) {
                    event.stopPropagation();
                });
            })
        </script>
    </body>
</html>
